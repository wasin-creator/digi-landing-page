<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIGI — Content Editor</title>
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  CMS.init({
    config: {
      backend: {
        name: 'github',
        repo: 'wasin-creator/digi-landing-page',
        branch: 'main',
        base_url: 'https://digi-landing-deploy.vercel.app',
        auth_endpoint: 'api/auth'
      },
      media_folder: 'assets/uploads',
      public_folder: '/assets/uploads',
      collections: [
        {
          name: 'content',
          label: 'เนื้อหาเว็บไซต์',
          files: [
            {
              file: 'content.json',
              label: 'แก้ไขข้อความ',
              name: 'main',
              fields: [
                {
                  label: '🌐 SEO',
                  name: 'site',
                  widget: 'object',
                  fields: [
                    { label: 'ชื่อเว็บ (Tab title)', name: 'title', widget: 'string' },
                    { label: 'คำอธิบาย', name: 'description', widget: 'string' }
                  ]
                },
                {
                  label: '🔝 Hero (ส่วนแรก)',
                  name: 'hero',
                  widget: 'object',
                  fields: [
                    { label: 'Tagline', name: 'tagline', widget: 'string' },
                    { label: 'หัวข้อ บรรทัด 1', name: 'headline_line1', widget: 'string' },
                    { label: 'หัวข้อ เน้น (italic)', name: 'headline_em', widget: 'string' },
                    { label: 'หัวข้อ บรรทัด 2', name: 'headline_line2', widget: 'string' },
                    { label: 'คำอธิบายย่อย', name: 'subtext', widget: 'text' },
                    { label: 'ปุ่ม หลัก', name: 'cta_primary', widget: 'string' },
                    { label: 'ปุ่ม รอง', name: 'cta_secondary', widget: 'string' }
                  ]
                },
                {
                  label: '📊 ตัวเลข (Stats)',
                  name: 'stats',
                  widget: 'list',
                  fields: [
                    { label: 'ตัวเลข', name: 'number', widget: 'string' },
                    { label: 'คำอธิบาย', name: 'label', widget: 'string' }
                  ]
                },
                {
                  label: '🎬 ผลงาน (Work section)',
                  name: 'work',
                  widget: 'object',
                  fields: [
                    { label: 'หัวข้อ', name: 'heading', widget: 'string' },
                    { label: 'คำอธิบาย', name: 'subheading', widget: 'string' },
                    {
                      label: '🖼️ รูป / 🎬 วิดีโอ ผลงาน',
                      name: 'images',
                      widget: 'object',
                      hint: 'อัปได้ทั้งรูป (.jpg .png .webp) และวิดีโอ (.mp4 .webm) — ลบได้โดยล้างช่อง',
                      fields: [
                        { label: 'ช่อง 1 — Séra Skin (รูป/วิดีโอ)', name: 'w1', widget: 'file', media_library: { config: { multiple: false } }, required: false },
                        { label: 'ช่อง 2 — The Grove Clinic (รูป/วิดีโอ)', name: 'w2', widget: 'file', media_library: { config: { multiple: false } }, required: false },
                        { label: 'ช่อง 3 — Aalto Resorts (รูป/วิดีโอ)', name: 'w3', widget: 'file', media_library: { config: { multiple: false } }, required: false },
                        { label: 'ช่อง 4 — Casa Pelo (รูป/วิดีโอ)', name: 'w4', widget: 'file', media_library: { config: { multiple: false } }, required: false },
                        { label: 'ช่อง 5 — Halcyon (รูป/วิดีโอ)', name: 'w5', widget: 'file', media_library: { config: { multiple: false } }, required: false }
                      ]
                    }
                  ]
                },
                {
                  label: '🤝 โลโก้ลูกค้า (Client logos)',
                  name: 'clients',
                  widget: 'list',
                  label_singular: 'โลโก้',
                  hint: 'แถบโลโก้ที่เลื่อนอัตโนมัติ — เพิ่ม/ลบ/สลับลำดับได้ (แนะนำไฟล์ขาวหรือโมโนโครม .svg / .png พื้นโปร่ง เพราะระบบ render เป็นสีขาว)',
                  fields: [
                    { label: 'ชื่อ', name: 'name', widget: 'string' },
                    { label: 'โลโก้ (.svg / .png)', name: 'logo', widget: 'file', required: false }
                  ]
                },
                {
                  label: '🛠️ บริการ (Services)',
                  name: 'services',
                  widget: 'list',
                  fields: [
                    { label: 'ชื่อ (ปกติ)', name: 'name', widget: 'string' },
                    { label: 'ชื่อ (ตัวเอียง)', name: 'em', widget: 'string' },
                    { label: 'คำอธิบาย', name: 'desc', widget: 'string' }
                  ]
                },
                {
                  label: '▶️ YouTube Channel',
                  name: 'youtube',
                  widget: 'object',
                  fields: [
                    { label: 'หัวข้อ Section', name: 'heading', widget: 'string' },
                    { label: 'ลิงก์ "View All" (URL ช่อง YouTube)', name: 'view_all_url', widget: 'string' },
                    {
                      label: 'วิดีโอ (3 รายการ)',
                      name: 'videos',
                      widget: 'list',
                      max: 6,
                      fields: [
                        {
                          label: 'YouTube Video ID',
                          name: 'id',
                          widget: 'string',
                          hint: 'เอา ID จาก URL: youtube.com/watch?v=▶ ABC123xyz ◀ ใส่แค่ส่วนนี้',
                          required: false
                        },
                        { label: 'ชื่อวิดีโอ', name: 'title', widget: 'string' }
                      ]
                    }
                  ]
                },
                {
                  label: '💬 รีวิว (Testimonials)',
                  name: 'testimonials',
                  widget: 'list',
                  fields: [
                    { label: 'คำพูด', name: 'quote', widget: 'text' },
                    { label: 'ชื่อ', name: 'author', widget: 'string' },
                    { label: 'ตำแหน่ง', name: 'role', widget: 'string' }
                  ]
                },
                {
                  label: '🔻 Footer',
                  name: 'footer',
                  widget: 'object',
                  fields: [
                    { label: 'คำอธิบายบริษัท', name: 'tagline', widget: 'text' },
                    { label: 'อีเมล', name: 'email', widget: 'string' },
                    { label: 'Copyright', name: 'copyright', widget: 'string' }
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
  });
  </script>
</body>
</html>
